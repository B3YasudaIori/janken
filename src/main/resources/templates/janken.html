<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.springframework.org/schema/security">

<head>
  <meta charset="utf-8">
  <title>Janken</title>
</head>

<body>
  <div> <a href="/logout">ログアウト</a></div>

  <h1>Janken Game!</h1>
  <p th:if="${userName != null}" th:text="|Hi ${userName}|"></p>

  <h2>エントリー</h2>

  <ul>
    <li th:each="user : ${users}">
      <a th:href="@{/sec/match(id=${user.id})}">
        [[${user.userName}]]
      </a>
    </li>
  </ul>

  <h2>試合結果</h2>
  <div th:each="match : ${matches}">
    <p>
      ID: [[${match.id}]]
      user1：[[${match.user1}]]
      user2：[[${match.user2}]]
      user1の手：[[${match.user1Hand}]]
      user2の手：[[${match.user2Hand}]]
    </p>
  </div>
</body>

</html>
